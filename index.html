<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./resources/ol.css">
    
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; transition: all 0.3s ease; }
        #sidebar { width: 320px; transition: all 0.3s ease; flex-shrink: 0; z-index: 1001; }
        #sidebar.collapsed { margin-left: -320px; }
        
        /* Popup Styling */
        .ol-popup { position: absolute; background-color: white; padding: 15px; border-radius: 10px; border: 1px solid #cccccc; bottom: 12px; left: -50px; min-width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .bg-navbar { background-color: #2d5a27; }
        .bg-sidebar { background-color: #1e212d; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <nav class="h-[80px] bg-navbar flex items-center px-6 shadow-lg z-[2000] text-white">
        <button onclick="toggleSidebar()" class="mr-4 text-xl"><i class="fas fa-bars"></i></button>
        <h1 class="font-bold uppercase">Smart Resident Explorer</h1>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="bg-sidebar h-full text-white p-5 border-l border-gray-800 overflow-y-auto">
            <div class="space-y-4">
                <input type="text" id="lotInput" placeholder="No Lot..." class="w-full bg-gray-800 p-2 rounded text-sm text-white">
                <button onclick="searchLot()" class="w-full bg-green-700 py-2 rounded text-sm font-bold">Cari Data</button>
            </div>
        </aside>

        <div id="map" class="flex-1 relative">
            <div id="popup" class="ol-popup hidden">
                <div id="popup-content"></div>
            </div>
        </div>
    </div>

    <script src="./resources/ol.js"></script>
    <script src="layers/Lotfinal_0.js"></script>
    <script src="layers/batusempadanmerge_1.js"></script>
    <script src="./layers/layers.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        // Setup Popup
        var container = document.getElementById('popup');
        var content = document.getElementById('popup-content');
        var overlay = new ol.Overlay({ element: container, autoPan: true });
        map.addOverlay(overlay);

        // Interaction Click
        map.on('singleclick', function (evt) {
            var feature = map.forEachFeatureAtPixel(evt.pixel, function (feat, layer) {
                return { feat: feat, title: layer.get('title') };
            });

            if (feature) {
                var props = feature.feat.getProperties();
                content.innerHTML = ""; // Reset
                
                if (feature.title === 'Lot Final') {
                    content.innerHTML = `<b>LOT:</b> ${props.NO_LOT}<br><b>PEMILIK:</b> ${props['tsp — pe'] || 'Tiada'}`;
                } else {
                    var coord = ol.proj.toLonLat(evt.coordinate);
                    content.innerHTML = `<b>KOORDINAT BATU:</b><br>Lat: ${coord[1].toFixed(6)}<br>Lon: ${coord[0].toFixed(6)}`;
                }
                
                container.classList.remove('hidden');
                overlay.setPosition(evt.coordinate);
            } else {
                container.classList.add('hidden');
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 300);
        }
    </script>
</body>
</html>
