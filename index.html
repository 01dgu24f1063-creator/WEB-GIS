<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; overflow: hidden; }
            #map { width: 100%; height: 100%; transition: all 0.3s; }
            #sidebar { transition: all 0.3s ease; }
            .bg-navbar { background-color: #2d5a27; } 
            .bg-sidebar { background-color: #1e212d; }
            .bg-card { background-color: #111319; }
            .text-accent { color: #4ade80; }
            
            .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
            .switch input { opacity: 0; width: 0; height: 0; }
            .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
            .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
            input:checked + .slider { background-color: #22c55e; }
            input:checked + .slider:before { transform: translateX(14px); }
        </style>
        <title>Smart Resident - Land Explorer</title>
    </head>
    <body class="flex flex-col h-screen">

        <nav class="h-[80px] bg-navbar flex items-center px-6 shadow-lg z-[2000] shrink-0 border-b border-green-800">
            <button onclick="toggleSidebar()" class="text-white text-xl mr-4 hover:text-green-400">
                <i class="fas fa-bars"></i>
            </button>
            <div class="flex flex-row items-center gap-4">
                <div class="bg-white p-1 rounded-md w-12 h-12 flex items-center justify-center">
                    <img src="Poli_Logo.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div class="flex flex-col leading-tight">
                    <h1 class="text-white text-xl font-extrabold italic uppercase">smart resident</h1>
                    <span class="text-[10px] text-green-400 font-bold uppercase">Land Explorer System</span>
                </div>
            </div>
        </nav>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="map" class="flex-1 z-0 relative"></div>

            <aside id="sidebar" class="w-80 bg-sidebar h-full text-white p-5 shadow-2xl z-[1001] border-l border-gray-800 overflow-y-auto">
                <div class="flex justify-end mb-4 md:hidden">
                    <button onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="mb-6 p-4 bg-card rounded-md border border-gray-700 space-y-4">
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest mb-3">Kawalan Layer</p>
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium">Batu Sempadan</span>
                        <label class="switch"><input type="checkbox" checked onchange="toggleLayer('batu', this.checked)"><span class="slider"></span></label>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium">Lot Final</span>
                        <label class="switch"><input type="checkbox" checked onchange="toggleLayer('lot', this.checked)"><span class="slider"></span></label>
                    </div>
                </div>

                <div class="space-y-3 mb-8">
                    <label class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Carian Data</label>
                    <input type="text" id="lotInput" placeholder="No Lot atau Nama Pemilik" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm text-white focus:ring-2 focus:ring-green-500 outline-none">
                    <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2.5 rounded-md text-sm font-bold transition text-white">Cari Data</button>
                </div>
                
                <div class="space-y-4">
                    <div class="bg-card border-l-4 border-green-500 p-4"><p class="text-[9px] text-gray-500 font-bold uppercase">No Lot Dipilih</p><p class="text-accent text-lg font-bold" id="selectedLot">-</p></div>
                    <div class="bg-card border-l-4 border-green-500 p-4"><p class="text-[9px] text-gray-500 font-bold uppercase">Nama Pemilik</p><p class="text-accent text-sm font-bold" id="ownerName">-</p></div>
                </div>
            </aside>
        </div>

        <script>
            // Fungsi untuk toggle sidebar
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.style.display === 'none') {
                    sidebar.style.display = 'block';
                    sidebar.style.width = '320px';
                } else {
                    sidebar.style.display = 'none';
                }
            }
            
            // ... (Fungsi toggleLayer, highlightFeature, dan searchLot anda kekal sama)
        </script>
    </body>
</html>
