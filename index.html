<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; transition: all 0.3s ease; }
        /* Sidebar styling */
        #sidebar { 
            width: 320px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            z-index: 1001;
        }
        #sidebar.collapsed { margin-left: -320px; }
        
        .bg-navbar { background-color: #2d5a27; } 
        .bg-sidebar { background-color: #1e212d; }
        .bg-card { background-color: #111319; }
        .text-accent { color: #4ade80; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
    <title>Smart Resident - Land Explorer</title>
</head>
<body class="flex flex-col h-screen">

    <nav class="h-[80px] bg-navbar flex items-center px-6 shadow-lg z-[2000] shrink-0 border-b border-green-800">
        <button onclick="toggleSidebar()" class="text-white text-xl mr-4 hover:text-green-400">
            <i class="fas fa-bars"></i>
        </button>
        <div class="flex flex-col">
            <h1 class="text-white text-xl font-extrabold italic uppercase">smart resident</h1>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="bg-sidebar h-full text-white p-5 shadow-2xl border-l border-gray-800 overflow-y-auto">
            <div class="mb-6 p-4 bg-card rounded-md border border-gray-700 space-y-4">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-3">Kawalan Layer</p>
                <div class="flex items-center justify-between">
                    <span class="text-sm">Batu Sempadan</span>
                    <label class="switch"><input type="checkbox" id="toggleBatu" checked onchange="toggleLayer('batu', this.checked)"><span class="slider"></span></label>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-sm">Lot Final</span>
                    <label class="switch"><input type="checkbox" id="toggleLot" checked onchange="toggleLayer('lot', this.checked)"><span class="slider"></span></label>
                </div>
            </div>

            <div class="space-y-3 mb-8">
                <input type="text" id="lotInput" placeholder="No Lot atau Nama Pemilik" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm text-white focus:ring-2 focus:ring-green-500 outline-none">
                <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2.5 rounded-md text-sm font-bold text-white shadow-lg">Cari Data</button>
                <button onclick="location.reload()" class="w-full bg-gray-700 hover:bg-red-600 py-2.5 rounded-md text-sm font-bold text-white">Reset Peta</button>
            </div>

            <div class="space-y-4">
                <div class="bg-card border-l-4 border-green-500 p-4"><p class="text-[9px] text-gray-500 font-bold uppercase">No Lot Dipilih</p><p class="text-accent text-lg font-bold" id="selectedLot">-</p></div>
                <div class="bg-card border-l-4 border-green-500 p-4"><p class="text-[9px] text-gray-500 font-bold uppercase">Nama Pemilik</p><p class="text-accent text-sm font-bold uppercase" id="ownerName">-</p></div>
            </div>
        </aside>

        <div id="map" class="flex-1 z-0"></div>
    </div>

    <script src="resources/ol.js"></script>
    <script src="layers/Lotfinal_0.js"></script>
    <script src="layers/batusempadanmerge_1.js"></script>
    <script src="./layers/layers.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 300);
        }

        function toggleLayer(type, isVisible) {
            if (type === 'batu' && typeof lyr_batusempadanmerge_1 !== 'undefined') lyr_batusempadanmerge_1.setVisible(isVisible);
            if (type === 'lot' && typeof lyr_Lotfinal_0 !== 'undefined') lyr_Lotfinal_0.setVisible(isVisible);
        }

        function highlightFeature(feature) {
            if (feature) {
                var props = feature.getProperties();
                document.getElementById('selectedLot').innerText = props.NO_LOT || '-';
                document.getElementById('ownerName').innerText = props['tsp — pe'] || 'DATA TIADA';
            }
        }

        function searchLot() {
            var val = document.getElementById('lotInput').value.trim().toLowerCase();
            if(!val) return alert("Sila masukkan No Lot atau Nama.");
            var found = false;
            lyr_Lotfinal_0.getSource().getFeatures().forEach(function(f) {
                if(String(f.get('NO_LOT')).toLowerCase() === val || String(f.get('tsp — pe')).toLowerCase().includes(val)) {
                    map.getView().fit(f.getGeometry().getExtent(), { duration: 1000, padding: [50,50,50,50] });
                    highlightFeature(f);
                    found = true;
                }
            });
            if(!found) alert("Tiada data dijumpai.");
        }
    </script>
</body>
</html>
