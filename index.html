<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; overflow: hidden; }
            #map { width: 100%; height: 100%; }
            .bg-navbar { background-color: #2d5a27; } 
            .bg-sidebar { background-color: #1e212d; }
            .bg-card { background-color: #111319; }
            .text-accent { color: #4ade80; }
            
            /* CSS untuk Sidebar Collapsed */
            .sidebar-panel { 
                transition: transform 0.3s ease-in-out; 
                position: absolute; 
                right: 0; 
                top: 0; 
                height: 100%; 
                z-index: 1001;
            }
            .collapsed { transform: translateX(100%); }
            
            .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
            .switch input { opacity: 0; width: 0; height: 0; }
            .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 34px; }
            .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
            input:checked + .slider { background-color: #22c55e; }
            input:checked + .slider:before { transform: translateX(14px); }
        </style>
        <title>Smart Resident - Land Explorer</title>
    </head>
    <body class="flex flex-col h-screen overflow-hidden">

        <nav class="h-[100px] bg-navbar flex items-center justify-between px-6 shadow-lg z-[2000] shrink-0 border-b border-green-800">
            <div class="flex flex-row items-center gap-6">
                <div class="logo-container bg-white p-2 rounded-md w-20 h-20 flex items-center justify-center">
                    <img src="Poli_Logo.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div class="flex flex-col leading-tight">
                    <h1 class="text-white text-3xl font-extrabold italic uppercase tracking-wider">smart resident</h1>
                    <span class="text-xs text-green-400 font-bold uppercase tracking-[0.4em]">Land Explorer System</span>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="bg-green-600 text-white p-3 rounded-md hover:bg-green-500 transition">
                <i class="fa fa-bars text-xl"></i>
            </button>
        </nav>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="map" class="flex-1 z-0 relative"></div>

            <aside id="sidebar" class="sidebar-panel w-80 bg-sidebar text-white p-5 shadow-2xl border-l border-gray-800 overflow-y-auto">
                <div class="mb-6 p-4 bg-card rounded-md border border-gray-700 space-y-4">
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest mb-3">Kawalan Layer</p>
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium">Batu Sempadan</span>
                        <label class="switch"><input type="checkbox" id="toggleBatu" checked onchange="toggleLayer('batu', this.checked)"><span class="slider"></span></label>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium">Lot Final</span>
                        <label class="switch"><input type="checkbox" id="toggleLot" checked onchange="toggleLayer('lot', this.checked)"><span class="slider"></span></label>
                    </div>
                </div>

                <div class="space-y-3 mb-8">
                    <label class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Carian Data</label>
                    <input type="text" id="lotInput" placeholder="No Lot atau Nama Pemilik" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm text-white focus:ring-2 focus:ring-green-500 outline-none">
                    <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2.5 rounded-md text-sm font-bold transition text-white">Cari Data</button>
                </div>
            </aside>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="layers/Lotfinal_0.js"></script>
        <script src="layers/batusempadanmerge_1.js"></script>
        <script src="styles/Lotfinal_0_style.js"></script>
        <script src="styles/batusempadanmerge_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/qgis2web.js"></script>

        <script>
            // Fungsi Toggle Sidebar
            function toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('collapsed');
            }

            // Fungsi Peta Asal anda
            var lyr_GoogleSatellite = new ol.layer.Tile({
                title: 'Google Satellite', type: 'base', visible: true,
                source: new ol.source.XYZ({ url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}' })
            });
            map.getLayers().insertAt(0, lyr_GoogleSatellite);

            function toggleLayer(type, isVisible) {
                if (type === 'batu' && typeof lyr_batusempadanmerge_1 !== 'undefined') lyr_batusempadanmerge_1.setVisible(isVisible);
                if (type === 'lot' && typeof lyr_Lotfinal_0 !== 'undefined') lyr_Lotfinal_0.setVisible(isVisible);
            }
        </script>
    </body>
</html>
