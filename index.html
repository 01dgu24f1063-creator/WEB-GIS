<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <script src="https://cdn.tailwindcss.com"></script>
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
            html, body { height: 100%; margin: 0; padding: 0; background-color: #ffffff; overflow: hidden; }
            #map { width: 100%; height: 100%; }
            .bg-navbar { background-color: #2d5a27; } 
            .bg-sidebar { background-color: #1e212d; }
            .bg-card { background-color: #111319; }
            .text-accent { color: #4ade80; }
        </style>
        <title>Smart Resident - Land Explorer</title>
    </head>
    <body class="flex flex-col h-screen">

        <nav class="h-[100px] bg-navbar flex items-center justify-center px-6 shadow-lg z-[2000] border-b border-green-800">
            <div class="flex flex-row items-center gap-6">
                <div class="bg-white p-2 rounded-md w-20 h-20 flex items-center justify-center shadow-lg">
                    <img src="Poli_Logo.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div class="flex flex-col leading-tight">
                    <h1 class="text-white text-3xl font-extrabold italic uppercase tracking-wider">smart resident</h1>
                    <span class="text-xs text-green-400 font-bold uppercase tracking-[0.4em]">Land Explorer System</span>
                </div>
            </div>
        </nav>

        <div class="flex flex-1 overflow-hidden relative">
            <div id="map" class="flex-1 z-0 relative"></div>

            <aside class="w-80 bg-sidebar h-full text-white p-5 shadow-2xl z-[1001] border-l border-gray-800 overflow-y-auto">
                <div class="mb-6 p-4 bg-card rounded-md border border-gray-700">
                    <p class="text-[10px] text-gray-400 font-bold uppercase mb-3">Jenis Peta</p>
                    <div class="space-y-2 mb-4">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="baseMap" value="satellite" checked onchange="changeBaseLayer(this.value)"> <span class="text-sm">Google Satellite</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="baseMap" value="roadmap" onchange="changeBaseLayer(this.value)"> <span class="text-sm">Google Street View</span></label>
                    </div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase mb-3">Kawalan Layer</p>
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium">Batu Sempadan</span>
                        <input type="checkbox" id="toggleBatu" checked onchange="toggleLayer(this.checked)" class="w-5 h-5 accent-green-500">
                    </div>
                </div>

                <div class="space-y-3 mb-8">
                    <input type="text" id="lotInput" placeholder="Contoh: 11462" class="w-full bg-card border border-gray-700 rounded-md p-3 text-sm focus:ring-2 focus:ring-green-500 outline-none">
                    <button onclick="searchLot()" class="w-full bg-green-700 hover:bg-green-600 py-2 rounded-md font-bold text-sm">Cari Lot</button>
                </div>

                <div class="space-y-4" id="infoPanel">
                    <div class="bg-card p-3 border-l-4 border-green-500"><p class="text-[9px] text-gray-500 uppercase">No Lot</p><p class="text-accent font-bold" id="selectedLot">-</p></div>
                    <div class="bg-card p-3 border-l-4 border-green-500"><p class="text-[9px] text-gray-500 uppercase">Pemilik</p><p class="text-accent font-bold" id="ownerName">-</p></div>
                </div>
            </aside>
        </div>

        <script src="./resources/ol.js"></script>
        <script src="./layers/layers.js"></script> 
        <script src="./resources/qgis2web.js"></script>

        <script>
            // Setup Base Maps
            var lyr_Satellite = new ol.source.XYZ({ url: 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}' });
            var lyr_Roadmap = new ol.source.XYZ({ url: 'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}' });
            
            // Masukkan Satellite sebagai layer pertama
            var baseLayer = new ol.layer.Tile({ source: lyr_Satellite });
            map.getLayers().insertAt(0, baseLayer);

            function changeBaseLayer(type) {
                baseLayer.setSource(type === 'satellite' ? lyr_Satellite : lyr_Roadmap);
            }

            function toggleLayer(isVisible) {
                if (typeof lyr_batusempadanmerge_1 !== 'undefined') lyr_batusempadanmerge_1.setVisible(isVisible);
            }

            // Fungsi auto-zoom ke layer Lot
            window.addEventListener('load', function() {
                setTimeout(() => {
                    if (typeof lyr_Lotfinal_0 !== 'undefined') {
                        var extent = lyr_Lotfinal_0.getSource().getExtent();
                        map.getView().fit(extent, {padding: [50, 50, 50, 50]});
                    }
                }, 1000);
            });

            function searchLot() {
                var val = document.getElementById('lotInput').value;
                lyr_Lotfinal_0.getSource().getFeatures().forEach(function(f) {
                    if(f.get('NO_LOT') == val) {
                        map.getView().fit(f.getGeometry().getExtent(), {duration: 1000, padding: [100, 100, 100, 100]});
                        document.getElementById('selectedLot').innerText = f.get('NO_LOT');
                        document.getElementById('ownerName').innerText = f.get('tsp — pe') || 'Tiada Data';
                    }
                });
            }
        </script>
    </body>
</html>
